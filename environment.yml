name: shadowdetectai
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.1.0
  - pytorch-cuda=11.8
  - pyg=2.4.0
  - numpy=1.26.0
  - scipy=1.11.3
  - scikit-learn=1.3.2
  - pandas=2.1.1
  - matplotlib=3.8.0
  - seaborn=0.13.0
  - pyyaml=6.0.1
  - tqdm=4.66.1
  - statsmodels=0.14.0
  - networkx=3.2.1
  - pip:
    - shap==0.43.0
    - torch-scatter==2.1.2
    - torch-sparse==0.6.18
